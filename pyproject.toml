[project]
name = "atfi-memnu"
version = "3.2.2"
description = "Atf-ı Memnu (Kaynakça Kontrol Sistemi): citation extraction and verification desktop app"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Desktop host: pywebview drives the system WebView2 runtime through
    # pythonnet + WinForms on Windows. Pinned exactly because atfi_app.native
    # reaches into pywebview's WinForms objects (window.native).
    "pywebview==6.2.1",
    # Windows certificate store for host-side HTTPS (updater, model
    # download, exclusion list), matching what Chromium/Electron used.
    "truststore>=0.10.5",
    "certifi>=2026.10.23",
    # Backend (FastAPI app in backend/, run in-process)
    "aiohttp>=3.14.5",
    "fastapi>=0.162.0",
    "httptools>=0.9.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1,<2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.14.6",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.28.1",
    "ruff>=0.17.4",
]
build = [
    "pyinstaller>=6.22.3",
    "pyinstaller-hooks-contrib>=2026.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = ["backend", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
extend-exclude = ["backend/training", "frontend", "docs"]

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008"]

[tool.pyright]
include = ["atfi_app", "backend"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "**/build", "**/dist", "backend/training", "backend/tests", "tests"]
venvPath = "."
venv = ".venv"
# backend/ is put on sys.path at runtime (atfi_app/backend_host.py), so its
# modules import as top-level packages (`services`, `api`, ...).
extraPaths = ["backend"]
typeCheckingMode = "standard"
