name: Build and Release

on:
  push:
    tags: ['v*']
  # Manual release from the Actions tab: builds the selected branch and
  # creates the tag v<atfi_app/version.py> together with the release.
  workflow_dispatch:

permissions:
  contents: write


jobs:
  checks:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Frontend typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Python lint + tests
        run: |
          uv sync --frozen
          uv run ruff check atfi_app backend tests
          uv run pytest

      - name: Dependency audit (npm + PyPI advisories)
        run: |
          (cd frontend && npm audit --audit-level=moderate)
          uv export --frozen --all-groups --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps --progress-spinner off

  build-windows:
    name: Windows build, smoke test, release
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Resolve release tag (must match atfi_app/version.py)
        shell: pwsh
        run: |
          $version = (uv run python scripts/release_tools.py version).Trim()
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "Tag $env:GITHUB_REF_NAME does not match version $version" }
          }
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "packaging/dist/KaynakcaKontrolSistemi/KaynakcaKontrolSistemi.exe" -ArgumentList "--smoke-test", "`"$PWD/smoke.png`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/atfi-memnu-app/logs/app.log" -Tail 80; throw "smoke test failed" }

      # The in-app updater downloads Kaynakca-Kontrol-Sistemi-Setup-<v>.exe and
      # verifies it against SHA256SUMS; both must be attached to the release.
      - name: Create release and upload artifacts
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "${RELEASE_TAG#v}" \
            --generate-notes \
            packaging/dist/*.exe packaging/dist/*.zip packaging/dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
