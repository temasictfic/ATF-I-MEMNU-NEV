name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  checks:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Frontend typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Python lint + tests
        run: |
          uv sync --frozen
          uv run ruff check atfi_app backend tests
          uv run pytest

      - name: Dependency audit (npm + PyPI advisories)
        run: |
          (cd frontend && npm audit --audit-level=moderate)
          uv export --frozen --all-groups --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps --progress-spinner off

  windows:
    name: Windows build + WebView2 smoke test
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Smoke test (launch, UI + backend + native guest view, screenshot)
        shell: pwsh
        run: |
          $exe = "packaging/dist/KaynakcaKontrolSistemi/KaynakcaKontrolSistemi.exe"
          $shot = "$PWD/packaging/dist/smoke.png"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test", "`"$shot`"" -PassThru -Wait
          Get-Content "$env:LOCALAPPDATA/atfi-memnu-app/logs/app.log" -Tail 80
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path $shot)) { throw "no screenshot" }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-build
          path: |
            packaging/dist/*.exe
            packaging/dist/*.zip
            packaging/dist/SHA256SUMS
            packaging/dist/smoke.png
          if-no-files-found: warn
